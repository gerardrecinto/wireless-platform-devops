---
- name: Update all packages
  dnf:
    name: "*"
    state: latest
    update_cache: true

- name: Install base packages
  dnf:
    name:
      - kernel-devel
      - kernel-headers
      - gcc
      - make
      - git
      - python3
      - python3-pip
      - ethtool
      - iproute
      - bridge-utils
      - pciutils
      - numactl
      - hwloc
      - perf
      - tuned
      - kmod
      - rpm-build
      - createrepo_c
    state: present

- name: Install psutil for monitoring scripts
  pip:
    name: psutil
    executable: pip3
    state: present

- name: Start and enable tuned
  systemd:
    name: tuned
    enabled: true
    state: started

- name: Set tuned profile to throughput-performance
  command: tuned-adm profile throughput-performance
  changed_when: true

- name: Disable transparent hugepages (reduces latency jitter)
  shell: |
    echo never > /sys/kernel/mm/transparent_hugepage/enabled
    echo never > /sys/kernel/mm/transparent_hugepage/defrag
  changed_when: true

- name: Persist THP disable on boot
  lineinfile:
    path: /etc/rc.d/rc.local
    line: |
      echo never > /sys/kernel/mm/transparent_hugepage/enabled
      echo never > /sys/kernel/mm/transparent_hugepage/defrag
    create: true
    mode: "0755"

- name: Set kernel parameters for low-latency networking
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: net.core.rmem_max,       value: "134217728" }
    - { name: net.core.wmem_max,       value: "134217728" }
    - { name: net.core.netdev_max_backlog, value: "5000" }
    - { name: net.ipv4.tcp_rmem,       value: "4096 87380 134217728" }
    - { name: net.ipv4.tcp_wmem,       value: "4096 65536 134217728" }
    - { name: vm.swappiness,           value: "1" }
    - { name: kernel.numa_balancing,   value: "0" }
